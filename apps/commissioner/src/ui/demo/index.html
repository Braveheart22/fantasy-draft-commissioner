<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>League Draft Demo Profile</title></head><body><main><h1>Deterministic demo profile</h1><p>This separate profile creates test data through normal application commands.</p><button id="create">Create prepared demo season</button><p id="status" role="status"></p></main><script>document.querySelector('#create').addEventListener('click',async event=>{const button=event.currentTarget,status=document.querySelector('#status');button.disabled=true;status.textContent='Creating…';try{const response=await fetch('/api/demo/seasons',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({preset:'PREPARED'})});const body=await response.json();status.textContent=response.ok?'Created demo season '+body.season.id:(body.message||'Demo setup failed');}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});</script></body></html>
